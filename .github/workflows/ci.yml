name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Built package loads in plain Node ESM
        run: node -e "import('./dist/index.js').then((m) => { if (typeof m.useFormErrors !== 'function' || typeof m.fromLaravel422 !== 'function') process.exit(1); })"
      - run: npm run example:build
